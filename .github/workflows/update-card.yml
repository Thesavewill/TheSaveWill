name: Generate SVG Card

on:
  schedule:
    - cron: "0 */12 * * *" # Запускать каждые 12 часов
  workflow_dispatch:       # Позволяет запускать вручную по кнопке

permissions:
  contents: write          # Разрешаем роботу сохранять картинку в репо

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Запускаем генератор SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install requests
          python generate_card.py

      - name: Сохраняем обновленную картинку в репозиторий
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git diff --staged --quiet || (git commit -m "Update SVG card" && git push)